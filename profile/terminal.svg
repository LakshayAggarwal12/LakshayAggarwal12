<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated terminal: Lakshay Aggarwal, Software Developer, open to internships" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lakshay Aggarwal - terminal intro</title>
  <style>
    .t{font-family:'Fira Code',Consolas,Menlo,monospace;font-size:15px;fill:#c9d1d9}
    .m{fill:#8b949e}
    .b{fill:#58a6ff}
    .g{fill:#3fb950}
    .l{opacity:0;animation:show .01s forwards}
    .d1{animation-delay:.6s}
    .d2{animation-delay:1.6s}
    .d3{animation-delay:2.6s}
    .d4{animation-delay:3.6s}
    .d5{animation-delay:4.6s}
    @keyframes show{to{opacity:1}}
    .cur{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);
         animation:load 3s 4.6s ease-in-out infinite}
    @keyframes load{0%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}
    .dot{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  </style>

  <rect width="800" height="280" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h780a10 10 0 0 1 10 10v24H0z" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="22" class="t m" text-anchor="middle" font-size="12">lakshay@dev: ~</text>

  <g class="l d1">
    <text x="24" y="68" class="t"><tspan class="g">$</tspan> whoami</text>
    <text x="44" y="90" class="t b">Lakshay Aggarwal · Software Developer</text>
  </g>

  <g class="l d2">
    <text x="24" y="122" class="t"><tspan class="g">$</tspan> cat stack.txt</text>
    <text x="44" y="144" class="t b">MERN · FastAPI · PostgreSQL · Generative AI</text>
  </g>

  <g class="l d3">
    <text x="24" y="176" class="t"><tspan class="g">$</tspan> git log --highlights</text>
    <text x="44" y="198" class="t b">ET AI Hackathon 2026 Semi-Finalist · IBM AI Intern</text>
  </g>

  <g class="l d4">
    <text x="24" y="230" class="t"><tspan class="g">$</tspan> status</text>
    <text x="44" y="252" class="t g"><tspan class="dot">●</tspan> open to internships</text>
  </g>

  <g class="l d5">
    <text x="420" y="252" class="t m" font-size="13">building next project</text>
    <rect x="590" y="241" width="180" height="10" rx="5" fill="#21262d"/>
    <rect x="590" y="241" width="180" height="10" rx="5" fill="#58a6ff" class="bar"/>
    <rect x="24" y="264" width="9" height="2" fill="#3fb950" class="cur"/>
  </g>
</svg>
