<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lakshay Aggarwal, Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lakshay Aggarwal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="230" y1="0" x2="670" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.35" stop-color="#7ee0ff"/>
      <stop offset="0.7" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="440 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="card"><rect width="900" height="230" rx="12"/></clipPath>
  </defs>
  <style>
    .p{font-family:'Fira Code',Consolas,Menlo,monospace;opacity:0;animation:rise 9s linear infinite}
    @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.55}85%{opacity:.35}100%{transform:translateY(-260px);opacity:0}}
    .orb1{animation:drift1 12s ease-in-out infinite alternate}
    .orb2{animation:drift2 14s ease-in-out infinite alternate}
    @keyframes drift1{from{transform:translateX(-80px)}to{transform:translateX(120px)}}
    @keyframes drift2{from{transform:translateX(100px)}to{transform:translateX(-120px)}}
    .name{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:56px;font-weight:700;letter-spacing:1px}
    .sub{font-family:'Fira Code',Consolas,Menlo,monospace;font-size:16px;fill:#8b949e;animation:fadein 1.2s .4s ease both}
    .line{transform-box:fill-box;transform-origin:center;animation:sweep 3.2s ease-in-out infinite}
    @keyframes sweep{0%,100%{transform:scaleX(.25);opacity:.5}50%{transform:scaleX(1);opacity:1}}
    @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .nm{animation:fadein 1s ease both}
    .glow{animation:pulse 3.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="orb1" cx="300" cy="90" r="70" fill="#58a6ff" fill-opacity=".22"/>
      <circle class="orb2" cx="600" cy="150" r="70" fill="#bc8cff" fill-opacity=".18"/>
    </g>
    <text x="28" y="260" class="p" font-size="20" fill="#58a6ff" style="animation-duration:7s;animation-delay:-0.51s">01</text>
    <text x="77" y="248" class="p" font-size="16" fill="#79c0ff" style="animation-duration:7s;animation-delay:-0.60s">{ }</text>
    <text x="116" y="237" class="p" font-size="20" fill="#58a6ff" style="animation-duration:7s;animation-delay:-5.79s">&lt;/&gt;</text>
    <text x="169" y="250" class="p" font-size="14" fill="#58a6ff" style="animation-duration:11s;animation-delay:-6.44s">&lt;&gt;</text>
    <text x="217" y="231" class="p" font-size="16" fill="#58a6ff" style="animation-duration:9s;animation-delay:-3.77s">//</text>
    <text x="276" y="239" class="p" font-size="16" fill="#3fb950" style="animation-duration:7s;animation-delay:-4.07s">//</text>
    <text x="317" y="233" class="p" font-size="14" fill="#3fb950" style="animation-duration:11s;animation-delay:-0.66s">//</text>
    <text x="369" y="251" class="p" font-size="20" fill="#79c0ff" style="animation-duration:9s;animation-delay:-4.19s">//</text>
    <text x="413" y="239" class="p" font-size="16" fill="#bc8cff" style="animation-duration:8s;animation-delay:-0.65s">( )</text>
    <text x="466" y="245" class="p" font-size="20" fill="#58a6ff" style="animation-duration:9s;animation-delay:-5.48s">[]</text>
    <text x="501" y="246" class="p" font-size="16" fill="#79c0ff" style="animation-duration:9s;animation-delay:-1.37s">&amp;&amp;</text>
    <text x="559" y="231" class="p" font-size="14" fill="#bc8cff" style="animation-duration:11s;animation-delay:-6.30s">&lt;&gt;</text>
    <text x="604" y="252" class="p" font-size="20" fill="#58a6ff" style="animation-duration:11s;animation-delay:-8.77s">[]</text>
    <text x="644" y="260" class="p" font-size="20" fill="#bc8cff" style="animation-duration:7s;animation-delay:-0.42s">=&gt;</text>
    <text x="710" y="248" class="p" font-size="20" fill="#bc8cff" style="animation-duration:9s;animation-delay:-6.45s">&lt;&gt;</text>
    <text x="738" y="260" class="p" font-size="18" fill="#79c0ff" style="animation-duration:8s;animation-delay:-4.89s">;</text>
    <text x="787" y="236" class="p" font-size="16" fill="#79c0ff" style="animation-duration:8s;animation-delay:-3.18s">=&gt;</text>
    <text x="836" y="235" class="p" font-size="20" fill="#3fb950" style="animation-duration:11s;animation-delay:-3.06s">;</text>
  </g>
  <rect x="1" y="1" width="898" height="228" rx="11" fill="none" stroke="#58a6ff" stroke-width="1.5" class="glow"/>

  <text x="450" y="112" text-anchor="middle" class="name nm" fill="url(#name)">Lakshay Aggarwal</text>
  <rect x="340" y="132" width="220" height="3" rx="1.5" fill="#58a6ff" class="line"/>
  <text x="450" y="170" text-anchor="middle" class="sub">// full-stack · backend · generative AI</text>
</svg>
