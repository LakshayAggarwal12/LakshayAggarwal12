<svg width="850" height="300" viewBox="0 0 850 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Lakshay: builds full-stack and AI-integrated products; third-year B.Tech CSE Data Science; looking for backend, full-stack and software engineering internships" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>About</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="400" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="360 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'Fira Code',Consolas,Menlo,monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .lbl{font-size:12px;letter-spacing:3px;fill:#58a6ff}
    .h{font-size:30px;font-weight:700}
    .info{font-size:15px;fill:#c9d1d9}
    .ct{font-family:'Fira Code',Consolas,Menlo,monospace;font-size:13px}
    .in{animation:fadein .7s ease both}
    @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .chip{animation:float 3.6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .march{stroke-dasharray:8 12;animation:march 2.5s linear infinite}
    @keyframes march{to{stroke-dashoffset:-80}}
    .dot{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  </style>

  <rect width="850" height="300" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="848" height="298" rx="11" fill="none" stroke="#30363d"/>
  <rect x="3" y="3" width="844" height="294" rx="10" fill="none" stroke="#58a6ff" stroke-opacity=".55" class="march"/>

  <!-- left column -->
  <g class="in" style="animation-delay:.1s">
    <circle cx="46" cy="55" r="4" fill="#3fb950" class="dot"/>
    <text x="60" y="59" class="mono lbl">WHO I AM</text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <text x="40" y="108" class="sans h" fill="url(#title)">Building full-stack and</text>
    <text x="40" y="146" class="sans h" fill="url(#title)">AI-integrated products</text>
  </g>
  <g class="in" style="animation-delay:.7s">
    <circle cx="46" cy="191" r="5" fill="#58a6ff"/><text x="62" y="196" class="sans info">3rd-year B.Tech CSE (Data Science) · Batch 2028</text>
  </g>
  <g class="in" style="animation-delay:1.0s">
    <circle cx="46" cy="225" r="5" fill="#3fb950"/><text x="62" y="230" class="sans info">REST APIs, databases and deployment</text>
  </g>
  <g class="in" style="animation-delay:1.3s">
    <circle cx="46" cy="259" r="5" fill="#bc8cff"/><text x="62" y="264" class="sans info">Looking for backend / full-stack / SWE internships</text>
  </g>

  <!-- divider -->
  <line x1="448" y1="40" x2="448" y2="260" stroke="#30363d"/>

  <!-- right column -->
  <g class="in" style="animation-delay:.2s">
    <text x="480" y="59" class="mono lbl">ASK ME ABOUT</text>
  </g>
  <g>
    <g class="chip" style="animation-delay:-0.0s"><g class="in" style="animation-delay:0.30s"><rect x="480" y="84" width="50" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".6"/><text x="505.0" y="104" text-anchor="middle" class="ct" fill="#58a6ff">C++</text></g></g>
    <g class="chip" style="animation-delay:-0.35s"><g class="in" style="animation-delay:0.42s"><rect x="540" y="84" width="50" height="30" rx="15" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/><text x="565.0" y="104" text-anchor="middle" class="ct" fill="#3fb950">DSA</text></g></g>
    <g class="chip" style="animation-delay:-0.7s"><g class="in" style="animation-delay:0.54s"><rect x="600" y="84" width="58" height="30" rx="15" fill="#161b22" stroke="#bc8cff" stroke-opacity=".6"/><text x="629.0" y="104" text-anchor="middle" class="ct" fill="#bc8cff">MERN</text></g></g>
    <g class="chip" style="animation-delay:-1.05s"><g class="in" style="animation-delay:0.66s"><rect x="668" y="84" width="82" height="30" rx="15" fill="#161b22" stroke="#ffa657" stroke-opacity=".6"/><text x="709.0" y="104" text-anchor="middle" class="ct" fill="#ffa657">Node.js</text></g></g>
    <g class="chip" style="animation-delay:-1.4s"><g class="in" style="animation-delay:0.78s"><rect x="480" y="124" width="82" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".6"/><text x="521.0" y="144" text-anchor="middle" class="ct" fill="#58a6ff">Express</text></g></g>
    <g class="chip" style="animation-delay:-1.75s"><g class="in" style="animation-delay:0.90s"><rect x="572" y="124" width="82" height="30" rx="15" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/><text x="613.0" y="144" text-anchor="middle" class="ct" fill="#3fb950">MongoDB</text></g></g>
    <g class="chip" style="animation-delay:-2.1s"><g class="in" style="animation-delay:1.02s"><rect x="664" y="124" width="106" height="30" rx="15" fill="#161b22" stroke="#bc8cff" stroke-opacity=".6"/><text x="717.0" y="144" text-anchor="middle" class="ct" fill="#bc8cff">PostgreSQL</text></g></g>
    <g class="chip" style="animation-delay:-2.45s"><g class="in" style="animation-delay:1.14s"><rect x="480" y="164" width="98" height="30" rx="15" fill="#161b22" stroke="#ffa657" stroke-opacity=".6"/><text x="529.0" y="184" text-anchor="middle" class="ct" fill="#ffa657">REST APIs</text></g></g>
    <g class="chip" style="animation-delay:-2.8s"><g class="in" style="animation-delay:1.26s"><rect x="588" y="164" width="50" height="30" rx="15" fill="#161b22" stroke="#58a6ff" stroke-opacity=".6"/><text x="613.0" y="184" text-anchor="middle" class="ct" fill="#58a6ff">Git</text></g></g>
    <g class="chip" style="animation-delay:-3.15s"><g class="in" style="animation-delay:1.38s"><rect x="648" y="164" width="82" height="30" rx="15" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/><text x="689.0" y="184" text-anchor="middle" class="ct" fill="#3fb950">Backend</text></g></g>
  </g>
</svg>
